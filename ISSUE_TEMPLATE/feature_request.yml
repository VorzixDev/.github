name: Feature request
description: Suggest an improvement for a public VorzixDev repository or product.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Suggestions may be reviewed, modified, combined, postponed, declined, or accepted. Submitting an idea does not create ownership, compensation, revenue-share, contributor status, or a guarantee of implementation.
  - type: input
    id: product
    attributes:
      label: Product or repository
      placeholder: Example: Ultimate Door & Access System Pack
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Product feature
        - User interface or experience
        - Documentation
        - Integration
        - Performance
        - Accessibility
        - Developer workflow
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: What problem would this feature solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the requested behavior and expected value.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe workarounds or alternatives, if any.
  - type: textarea
    id: references
    attributes:
      label: References or examples
      description: Do not upload confidential or copyrighted material without authorization.
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I searched existing requests for duplicates.
          required: true
        - label: I understand that this request is not a promise of implementation or compensation.
          required: true
