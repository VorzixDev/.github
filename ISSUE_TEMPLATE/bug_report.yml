name: Bug report
description: Report a reproducible problem in a public VorzixDev repository or supported product.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Do not use this form for security vulnerabilities, leaked secrets, private customer information, or exploit details. Follow SECURITY.md instead.
  - type: input
    id: product
    attributes:
      label: Product or repository
      description: Identify the affected VorzixDev product or repository.
      placeholder: Example: Advanced NPC Dialogue System
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or release
      placeholder: Example: v1.0.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform or engine
      options:
        - Roblox Studio / Roblox
        - Unity
        - Unreal Engine
        - Windows desktop software
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: Explain the problem clearly.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open...
        2. Configure...
        3. Run...
        4. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include device, operating system, engine version, relevant plugins, and configuration.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, or video
      description: Remove secrets, personal information, customer data, and private project files.
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: This report does not contain a security vulnerability or secret.
          required: true
        - label: I removed passwords, tokens, personal data, and confidential information.
          required: true
